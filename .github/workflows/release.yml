name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Verify tag and package version
        run: |
          PACKAGE_VERSION="$(bun -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          git describe --tags --exact-match HEAD | grep -Fx "$GITHUB_REF_NAME"
      - name: Require Homebrew tap automation credential
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: test -n "$HOMEBREW_TAP_DEPLOY_KEY"
      - run: bun run check:ci

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            target: bun-darwin-arm64
            expected_file: arm64
          - architecture: x86_64
            runner: macos-15-intel
            target: bun-darwin-x64-baseline
            expected_file: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Build native standalone CLI
        env:
          SESSIONMAP_TARGET: ${{ matrix.target }}
          SESSIONMAP_OUTFILE: dist/sessionmap-${{ matrix.architecture }}
        run: bun run build
      - name: Verify executable architecture
        env:
          EXPECTED_FILE: ${{ matrix.expected_file }}
          RELEASE_ARCH: ${{ matrix.architecture }}
        run: |
          file "dist/sessionmap-$RELEASE_ARCH"
          file "dist/sessionmap-$RELEASE_ARCH" | grep -q "$EXPECTED_FILE"
      - name: Smoke install, health, and restart
        env:
          RELEASE_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          SMOKE_STATE="$RUNNER_TEMP/sessionmap-release-smoke"
          RELEASE_BINARY="dist/sessionmap-$RELEASE_ARCH"
          cleanup() {
            if [ -x "$HOME/.local/bin/sessionmap" ]; then
              "$HOME/.local/bin/sessionmap" uninstall || true
            fi
          }
          trap cleanup EXIT
          "$RELEASE_BINARY" install --state-dir "$SMOKE_STATE"
          curl --fail --silent --show-error http://127.0.0.1:4317/health
          launchctl kickstart -k "gui/$(id -u)/com.haocyber.sessionmap.service"
          for attempt in {1..100}; do
            if curl --fail --silent http://127.0.0.1:4317/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 100 ]; then
              printf '%s\n' "SessionMap did not recover after launchd restart." >&2
              exit 1
            fi
            sleep 0.2
          done
          "$HOME/.local/bin/sessionmap" status --state-dir "$SMOKE_STATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.architecture }}
          path: dist/sessionmap-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      APPLE_APPLICATION_CERTIFICATE_P12: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12 }}
      APPLE_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - name: Require signing and notarization credentials
        run: |
          set -euo pipefail
          REQUIRED_SECRETS=(
            APPLE_APPLICATION_CERTIFICATE_P12
            APPLE_APPLICATION_CERTIFICATE_PASSWORD
            APPLE_INSTALLER_CERTIFICATE_P12
            APPLE_INSTALLER_CERTIFICATE_PASSWORD
            APPLE_NOTARY_KEY_P8
            APPLE_NOTARY_KEY_ID
          )
          for secret_name in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              printf 'Missing required release secret: %s\n' "$secret_name" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificates
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/sessionmap-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_APPLICATION_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/application.p12"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/application.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_APPLICATION_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          APPLICATION_IDENTITY="$(security find-identity -v "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Installer/ { print $2; exit }')"
          test -n "$APPLICATION_IDENTITY"
          test -n "$INSTALLER_IDENTITY"
          printf 'APPLICATION_IDENTITY=%s\n' "$APPLICATION_IDENTITY" >> "$GITHUB_ENV"
          printf 'INSTALLER_IDENTITY=%s\n' "$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
      - name: Sign binaries and build archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release components

          SESSIONMAP_APP_ARCHS=arm64,x86_64 SESSIONMAP_APP_SKIP_SIGN=1 bun run build:app
          codesign --force --sign "$APPLICATION_IDENTITY" --options runtime --timestamp "dist/SessionMap.app"
          codesign --verify --strict --deep --verbose=2 "dist/SessionMap.app"
          file "dist/SessionMap.app/Contents/MacOS/SessionMap" | grep -q "arm64"
          file "dist/SessionMap.app/Contents/MacOS/SessionMap" | grep -q "x86_64"

          for architecture in arm64 x86_64; do
            BINARY="binaries/sessionmap-$architecture"
            chmod 755 "$BINARY"
            codesign --force --sign "$APPLICATION_IDENTITY" --options runtime --entitlements scripts/macos/entitlements.plist --timestamp "$BINARY"
            codesign --verify --strict --verbose=2 "$BINARY"

            ARCHIVE_ROOT="$RUNNER_TEMP/archive-$architecture"
            mkdir -p "$ARCHIVE_ROOT/third-party-licenses"
            cp "$BINARY" "$ARCHIVE_ROOT/sessionmap"
            cp LICENSE README.md THIRD_PARTY_NOTICES.md "$ARCHIVE_ROOT/"
            cp packages/web/src/vendor/*_LICENSE "$ARCHIVE_ROOT/third-party-licenses/"
            COPYFILE_DISABLE=1 tar -czf "release/sessionmap-$VERSION-darwin-$architecture.tar.gz" -C "$ARCHIVE_ROOT" .

            PACKAGE_ROOT="$RUNNER_TEMP/pkg-root-$architecture"
            PACKAGE_SCRIPTS="$RUNNER_TEMP/pkg-scripts-$architecture"
            mkdir -p "$PACKAGE_ROOT/usr/local/libexec/sessionmap" "$PACKAGE_ROOT/usr/local/share/doc/sessionmap" "$PACKAGE_ROOT/Applications" "$PACKAGE_SCRIPTS"
            cp "$BINARY" "$PACKAGE_ROOT/usr/local/libexec/sessionmap/sessionmap"
            ditto "dist/SessionMap.app" "$PACKAGE_ROOT/Applications/SessionMap.app"
            cp LICENSE README.md THIRD_PARTY_NOTICES.md "$PACKAGE_ROOT/usr/local/share/doc/sessionmap/"
            cp scripts/macos/postinstall "$PACKAGE_SCRIPTS/postinstall"
            chmod 755 "$PACKAGE_SCRIPTS/postinstall"
            xattr -cr "$PACKAGE_ROOT" "$PACKAGE_SCRIPTS"
            COPYFILE_DISABLE=1 pkgbuild \
              --root "$PACKAGE_ROOT" \
              --scripts "$PACKAGE_SCRIPTS" \
              --identifier "com.haocyber.sessionmap.$architecture" \
              --version "$VERSION" \
              --install-location / \
              "components/sessionmap-$architecture.pkg"
          done
          productbuild \
            --distribution scripts/macos/Distribution.xml \
            --package-path components \
            --sign "$INSTALLER_IDENTITY" \
            "release/SessionMap-$VERSION.pkg"
          pkgutil --check-signature "release/SessionMap-$VERSION.pkg"
      - name: Notarize and assess installer
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8" | base64 -D > "$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"
          NOTARY_ARGS=(--key "$NOTARY_KEY" --key-id "$APPLE_NOTARY_KEY_ID")
          if [ -n "$APPLE_NOTARY_ISSUER_ID" ]; then
            NOTARY_ARGS+=(--issuer "$APPLE_NOTARY_ISSUER_ID")
          fi
          xcrun notarytool submit "release/SessionMap-$VERSION.pkg" "${NOTARY_ARGS[@]}" --wait
          xcrun stapler staple "release/SessionMap-$VERSION.pkg"
          xcrun stapler validate "release/SessionMap-$VERSION.pkg"
          spctl --assess --type install --verbose=2 "release/SessionMap-$VERSION.pkg"
      - name: Prepare checksums
        run: |
          set -euo pipefail
          cp scripts/install.sh release/install.sh
          cd release
          shasum -a 256 SessionMap-*.pkg sessionmap-*.tar.gz install.sh > checksums.txt
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            release/SessionMap-*.pkg
            release/sessionmap-*.tar.gz
            release/install.sh
            release/checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ARGS=("$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "SessionMap $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"

  update-homebrew:
    needs: release
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Configure repository-scoped tap deploy key
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/homebrew-tap-deploy-key"
          KNOWN_HOSTS="$RUNNER_TEMP/github-known-hosts"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          ssh-keygen -y -f "$KEY_PATH" >/dev/null
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$KNOWN_HOSTS"
          test -s "$KNOWN_HOSTS"
          printf 'GIT_SSH_COMMAND=ssh -i %s -o IdentitiesOnly=yes -o UserKnownHostsFile=%s\n' \
            "$KEY_PATH" "$KNOWN_HOSTS" >> "$GITHUB_ENV"
      - name: Project the Release into the Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAP_DIRECTORY="$(brew --repository)/Library/Taps/hao-cyber/homebrew-tap"
          CHECKSUM_DIRECTORY="$RUNNER_TEMP/release"
          mkdir -p "$(dirname "$TAP_DIRECTORY")"
          git clone --depth 1 git@github.com:hao-cyber/homebrew-tap.git "$TAP_DIRECTORY"
          mkdir -p "$CHECKSUM_DIRECTORY"
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --dir "$CHECKSUM_DIRECTORY"
          bun run scripts/update-homebrew-formula.ts \
            --version "$GITHUB_REF_NAME" \
            --checksums "$CHECKSUM_DIRECTORY/checksums.txt" \
            --output "$TAP_DIRECTORY/Formula/sessionmap.rb"
          brew style hao-cyber/tap/sessionmap
          brew audit --strict --online hao-cyber/tap/sessionmap
          git -C "$TAP_DIRECTORY" diff --check
          if git -C "$TAP_DIRECTORY" diff --quiet; then
            echo "Homebrew Formula already matches $GITHUB_REF_NAME."
            exit 0
          fi
          git -C "$TAP_DIRECTORY" config user.name "github-actions[bot]"
          git -C "$TAP_DIRECTORY" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_DIRECTORY" add Formula/sessionmap.rb
          git -C "$TAP_DIRECTORY" commit -m "sessionmap $GITHUB_REF_NAME"
          git -C "$TAP_DIRECTORY" push origin HEAD:main
