name: Daily release candidate

on:
  schedule:
    # 22:00 Asia/Shanghai. GitHub cron is UTC.
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: daily-release
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: write

jobs:
  cut-release:
    if: github.repository == 'hao-cyber/session-map'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main
      - name: Pin the exact main source commit
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUCCESSFUL_CHECKS="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "check" and .conclusion == "success")] | length')"
          test "$SUCCESSFUL_CHECKS" -ge 1
      - name: Re-run the complete release gate
        run: bun run check:ci
      - name: Decide whether main needs a release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft == false)][0].tag_name')"
          test -n "$LATEST_TAG"
          git rev-parse "$LATEST_TAG^{commit}" >/dev/null
          RELEASE_SOURCE="$(git show -s --format='%(trailers:key=Release-Source,valueonly)' "$LATEST_TAG^{commit}" | tr -d '[:space:]')"
          if [ -z "$RELEASE_SOURCE" ]; then
            RELEASE_SOURCE="$(git rev-parse "$LATEST_TAG^{commit}")"
          fi
          if [ "$RELEASE_SOURCE" = "$SOURCE_SHA" ]; then
            echo "No source changes since $LATEST_TAG; no release will be created."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(bun run scripts/prepare-release-version.ts "$LATEST_TAG")"
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_VERSION="$(git show "$TAG:package.json" | jq -r '.version')"
            test "$TAG_VERSION" = "$VERSION"
            echo "Retrying the unpublished, immutable tag $TAG."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Create the immutable version commit and tag
        if: steps.candidate.outputs.create_tag == 'true'
        env:
          RELEASE_SOURCE: ${{ steps.candidate.outputs.source }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --check
          git diff --cached --quiet && { echo "Version preparation made no change." >&2; exit 1; }
          git commit -m "release: $RELEASE_TAG" -m "Release-Source: $RELEASE_SOURCE"
          git tag -a "$RELEASE_TAG" -m "SessionMap $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Dispatch the signed release pipeline
        if: steps.candidate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG"
