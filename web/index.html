<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>SessionMap — agent thinking map</title>
    <link rel="stylesheet" href="/assets/styles.css?v=__SESSIONMAP_ASSET_VERSION__" />
    <script nonce="__SESSIONMAP_NONCE__">
      (() => {
        const openTicketKey = "sessionmap.open-ticket.v1";
        const openIdKey = "sessionmap.open-id.v1";
        const openExpiryKey = "sessionmap.open-expiry.v1";
        const fragment = new URLSearchParams(location.hash.slice(1));
        const supplied = fragment.get("open");
        if (supplied && /^[A-Za-z0-9_.-]{64,512}$/.test(supplied)) {
          sessionStorage.setItem(openTicketKey, supplied);
          sessionStorage.removeItem(openIdKey);
          sessionStorage.removeItem(openExpiryKey);
          fragment.delete("open");
          const rest = fragment.toString();
          history.replaceState(null, "", `${location.pathname}${location.search}${rest ? `#${rest}` : ""}`);
        }
        window.SESSIONMAP_OPEN_TICKET = sessionStorage.getItem(openTicketKey) || "";
        window.SESSIONMAP_OPEN_ID = sessionStorage.getItem(openIdKey) || "";
        window.SESSIONMAP_OPEN_EXPIRY = Number(sessionStorage.getItem(openExpiryKey) || "0");
      })();
      window.SESSIONMAP_ASSET_VERSION = "__SESSIONMAP_ASSET_VERSION__";
      window.addEventListener("load", () => {
        setTimeout(() => {
          if (window.SESSIONMAP_READY) return;
          const key = "sessionmap.asset-reload";
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, "1");
            location.reload();
          }
        }, 1800);
      });
    </script>
    <script defer src="/assets/vendor/d3.min.js?v=__SESSIONMAP_ASSET_VERSION__"></script>
    <script defer src="/assets/vendor/markmap-lib.js?v=__SESSIONMAP_ASSET_VERSION__"></script>
    <script defer src="/assets/vendor/markmap-view.js?v=__SESSIONMAP_ASSET_VERSION__"></script>
    <script defer src="/assets/app.js?v=__SESSIONMAP_ASSET_VERSION__"></script>
  </head>
  <body>
    <header class="topbar" aria-label="SessionMap 状态栏">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <div>
          <strong>SessionMap</strong>
          <span id="status-line">正在读取工作线…</span>
        </div>
      </div>
      <div id="git-chips" class="git-chips" aria-label="有例外的工作目录"></div>
      <div class="toolbar">
        <button id="archived-button" class="quiet-button" type="button" hidden>
          <span class="icon icon-archive" aria-hidden="true"></span>
          <span id="archived-count">已归档 0</span>
        </button>
        <label class="engine-control">
          <span>Roll</span>
          <select id="engine-select" aria-label="Roll 引擎"></select>
        </label>
      </div>
    </header>

    <section id="now-bar" class="now-bar" aria-label="现在该看哪"></section>

    <main id="map-shell" tabindex="-1">
      <div id="directory" class="directory" role="region" aria-label="主题与 Session 目录"></div>
      <div id="loading" class="loading-state">
        <span class="busy-dot"></span>
        <span>重建主题与 Session 目录</span>
      </div>
    </main>

    <aside id="archive-drawer" class="archive-drawer" aria-label="已归档主线" hidden>
      <div class="drawer-head">
        <div><span class="eyebrow">对象恒存</span><h2>已归档主线</h2></div>
        <button class="icon-button" id="archive-close" type="button" aria-label="关闭">
          <span class="icon icon-x"></span>
        </button>
      </div>
      <p>归档只移出阅读面；session 继续生长，记忆不会删除。</p>
      <div id="archive-list" class="archive-list"></div>
    </aside>

    <div id="say-overlay" class="say-overlay" hidden>
      <form id="say-form" class="say-box">
        <span class="eyebrow">发给当前 session</span>
        <label id="say-label" for="say-input">消息</label>
        <textarea id="say-input" rows="3" maxlength="8000" autocomplete="off"></textarea>
        <div class="say-actions"><span>⌥ + 点击 · Enter 发送 · Shift+Enter 换行</span><button type="submit"><span class="icon icon-send"></span>发送</button></div>
      </form>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <noscript>SessionMap 需要 JavaScript 来渲染本地思维树。</noscript>
  </body>
</html>
